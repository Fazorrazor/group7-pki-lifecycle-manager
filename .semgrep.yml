rules:
  - id: group7-no-string-formatted-sql
    languages: [python]
    severity: ERROR
    message: "Potential SQL Injection detected: database execute called with formatted string. Use parameterized queries (%s or ?) only."
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"...", ...)
          - pattern: $CURSOR.execute("..." % (...), ...)
          - pattern: $CURSOR.execute("..." + $VAR, ...)

  - id: group7-enforce-autoescape
    languages: [python]
    severity: ERROR
    message: "Potential XSS vulnerability: template rendering environment must not disable autoescape."
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
    pattern: jinja2.Environment(..., autoescape=False, ...)

  - id: group7-cert-lifespan-policy
    languages: [python]
    severity: WARNING
    message: "Project policy violation: certificates must have a maximum lifespan of 30 days."
    metadata:
      security-policy: "Project 7 - Automated ACME short-lived certificates"
    pattern: validity_days = $DAYS
    where:
      - metavariable-comparison:
          metavariable: $DAYS
          comparison: int($DAYS) > 30
