server {
    listen 443 ssl;
    server_name billing.internal.lab localhost;

    ssl_certificate /etc/ssl/certs/tls.crt;
    ssl_certificate_key /etc/ssl/certs/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        default_type application/json;
        return 200 '{"service": "billing-service", "hostname": "billing.internal.lab", "status": "secure_tls", "pki_tier": "intermediate-ca", "security_bar": "compliant"}\n';
    }

    location /health {
        default_type application/json;
        return 200 '{"status": "healthy", "service": "billing-service"}\n';
    }
}

