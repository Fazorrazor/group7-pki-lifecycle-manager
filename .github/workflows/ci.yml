name: CI - Security Tests & Semgrep Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    name: Security Tests & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep

      - name: Run OWASP Unit Tests
        run: |
          pytest --cov=src --cov-report=term-missing tests/

      - name: Run Semgrep Static Application Security Testing (SAST)
        run: |
          semgrep scan --config auto --error .
